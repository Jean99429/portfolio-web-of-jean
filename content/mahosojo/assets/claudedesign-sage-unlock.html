<!DOCTYPE html>

<head>

<style>
  html,body{margin:0;background:#0A080F;display:flex;align-items:center;justify-content:center;min-height:100vh}
  a{color:#7572CF;text-decoration:none}a:hover{color:#fff}
  @keyframes sg-land{0%{transform:translateY(-210px) scale(.72);opacity:0}18%{opacity:1}70%{transform:translateY(6px) scale(1)}100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes sg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  @keyframes sg-breathe{0%,100%{opacity:.5}50%{opacity:.9}}
  @keyframes sg-rays{to{transform:rotate(360deg)}}
  @keyframes sg-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  @keyframes sg-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sg-pop{0%{opacity:0;transform:translateY(10px) scale(.7)}60%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}

</style>
</head>
<body>
<div style="width:402px;height:874px;position:relative;overflow:hidden;border-radius:38px;background:radial-gradient(120% 74% at 50% 34%, #2E2760 0%, #1E1840 30%, #130F29 58%, #0C0916 82%, #0A080F 100%);font-family:'DM Sans',system-ui,sans-serif;user-select:none">

    <div style="flex:1;height:32px;background:#100D1F"></div>
    <div style="flex:1;height:18px;background:#141026"></div>
    <div style="flex:1;height:42px;background:#100D1F"></div>

  <div style="position:absolute;inset:0;pointer-events:none">

    <div style="position:absolute;left:44px;top:552px;width:2px;height:2px;background:rgba(255,255,255,.32);animation:sg-twinkle 6s ease-in-out 1.7s infinite"></div>
  </div>

    <span>9:41</span>
    <span style="display:flex;gap:3px;align-items:center"><span style="width:4px;height:4px;background:rgba(255,255,255,.5)"></span><span style="width:4px;height:7px;background:rgba(255,255,255,.5)"></span><span style="width:4px;height:10px;background:rgba(255,255,255,.5)"></span><span style="width:14px;height:8px;border:2px solid rgba(255,255,255,.45);margin-left:4px;padding:1px"><span style="display:block;width:100%;height:100%;background:rgba(255,255,255,.6)"></span></span></span>
  </div>

  <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:0 34px;box-sizing:border-box">

    <div style="position:relative;width:100%;height:150px;margin-top:56px;display:flex;justify-content:center">

      <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;animation:sg-trail 1.1s ease-out both;transform-origin:top center">
        <div style="width:3px;height:3px;background:rgba(201,198,245,.18)"></div>
        <div style="width:3px;height:3px;background:rgba(201,198,245,.28)"></div>
        <div style="width:3px;height:3px;background:rgba(201,198,245,.42)"></div>
        <div style="width:4px;height:4px;background:rgba(201,198,245,.6)"></div>
        <div style="width:4px;height:4px;background:rgba(237,235,255,.85)"></div>
      </div>

      <div style="position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:150px;height:104px;background:linear-gradient(180deg, rgba(160,156,235,.42), rgba(117,114,207,.06) 78%, transparent);clip-path:polygon(34% 0%, 66% 0%, 100% 100%, 0% 100%);animation:sg-beam 3s ease-in-out 1s infinite"></div>

      <div style="position:absolute;top:30px;animation:sg-land 1.2s cubic-bezier(.22,.9,.3,1.1) both">
        <div style="display:flex;flex-direction:column;align-items:center;animation:sg-bob 3.4s ease-in-out 1.3s infinite">
          <div style="display:flex"><span style="width:6px;height:6px;background:#C9C6F5"></span><span style="width:6px;height:6px;background:#C9C6F5"></span></div>
          <div style="display:flex"><span style="width:6px;height:6px;background:#7572CF"></span><span style="width:6px;height:6px;background:#EDEBFF"></span><span style="width:6px;height:6px;background:#EDEBFF"></span><span style="width:6px;height:6px;background:#7572CF"></span></div>
          <div style="display:flex"><span style="width:6px;height:6px;background:#6064BF"></span><span style="width:6px;height:6px;background:#7572CF"></span><span style="width:6px;height:6px;background:#C9C6F5"></span><span style="width:6px;height:6px;background:#C9C6F5"></span><span style="width:6px;height:6px;background:#7572CF"></span><span style="width:6px;height:6px;background:#6064BF"></span></div>
          <div style="display:flex"><span style="width:6px;height:6px;background:#534398"></span><span style="width:6px;height:6px;background:#6064BF"></span><span style="width:6px;height:6px;background:#6064BF"></span><span style="width:6px;height:6px;background:#6064BF"></span><span style="width:6px;height:6px;background:#6064BF"></span><span style="width:6px;height:6px;background:#6064BF"></span><span style="width:6px;height:6px;background:#6064BF"></span><span style="width:6px;height:6px;background:#534398"></span></div>
          <div style="display:flex"><span style="width:6px;height:6px;background:#6753B0"></span><span style="width:6px;height:6px;background:#534398"></span><span style="width:6px;height:6px;background:#534398"></span><span style="width:6px;height:6px;background:#534398"></span><span style="width:6px;height:6px;background:#534398"></span><span style="width:6px;height:6px;background:#534398"></span><span style="width:6px;height:6px;background:#534398"></span><span style="width:6px;height:6px;background:#6753B0"></span></div>
          <div style="display:flex;margin-top:0"><span style="width:6px;height:6px"></span><span style="width:6px;height:6px;background:#EDEBFF"></span><span style="width:6px;height:6px"></span><span style="width:6px;height:6px;background:#C9C6F5"></span><span style="width:6px;height:6px;background:#C9C6F5"></span><span style="width:6px;height:6px"></span><span style="width:6px;height:6px;background:#EDEBFF"></span><span style="width:6px;height:6px"></span></div>
        </div>
      </div>
    </div>

    <div style="position:relative;width:232px;height:232px;margin-top:4px;display:flex;align-items:center;justify-content:center;animation:sg-burst .9s cubic-bezier(.2,.9,.3,1.05) 1.1s both">
      <div style="position:absolute;inset:-40px;background:radial-gradient(circle, rgba(237,235,255,.30) 0%, rgba(117,114,207,.28) 32%, rgba(83,67,152,.10) 58%, transparent 74%)"></div>
      <div style="position:absolute;inset:-20px;background:repeating-conic-gradient(from 12deg at 50% 50%, rgba(201,198,245,.30) 0deg 4deg, transparent 4deg 22deg);mask-image:radial-gradient(circle, rgba(0,0,0,.85) 20%, transparent 66%);-webkit-mask-image:radial-gradient(circle, rgba(0,0,0,.85) 20%, transparent 66%);animation:sg-rays 90s linear infinite"></div>

      <div style="position:absolute;left:0;top:0;width:18px;height:6px;background:#7572CF"></div><div style="position:absolute;left:0;top:0;width:6px;height:18px;background:#7572CF"></div>
      <div style="position:absolute;right:0;top:0;width:18px;height:6px;background:#7572CF"></div><div style="position:absolute;right:0;top:0;width:6px;height:18px;background:#7572CF"></div>
      <div style="position:absolute;left:0;bottom:0;width:18px;height:6px;background:#7572CF"></div><div style="position:absolute;left:0;bottom:0;width:6px;height:18px;background:#7572CF"></div>
      <div style="position:absolute;right:0;bottom:0;width:18px;height:6px;background:#7572CF"></div><div style="position:absolute;right:0;bottom:0;width:6px;height:18px;background:#7572CF"></div>

      <img src="./sage-unlock-sprite.png" alt="Sage" style="position:relative;width:196px;height:196px;object-fit:contain;image-rendering:pixelated">
    </div>

    <div style="margin-top:26px;font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:2.5px;color:rgba(201,198,245,.72);animation:sg-rise .6s ease-out 1.7s both">✦ NEW COMPANION UNLOCKED</div>

    <div style="margin-top:20px;display:flex;font-family:'Press Start 2P',monospace;font-size:34px;color:#EDEBFF;text-shadow:0 4px 0 #534398, 0 0 30px rgba(117,114,207,.75)">
      <span style="animation:sg-pop .34s ease-out 1.85s both">S</span><span style="animation:sg-pop .34s ease-out 1.93s both">a</span><span style="animation:sg-pop .34s ease-out 2.01s both">g</span><span style="animation:sg-pop .34s ease-out 2.09s both">e</span>
    </div>
  </div>
</div>
</body>
</html>
