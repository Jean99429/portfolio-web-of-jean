<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADHD Start App — 流程循环预览</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #08040f; }
  .stage {
    position: relative;
    width: 402px;
    height: 874px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #08040f; /* 从Jean真实录屏里直接取样的边缘像素值 */
  }
  .stage video {
    display: block;
    width: 402px;
    height: auto;
    border-radius: 6px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage">
    <video autoplay muted loop playsinline>
      <source src="./hero-recording.mp4" type="video/mp4">
    </video>
  </div>
</body>
</html>
