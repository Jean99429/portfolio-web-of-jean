<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage Clear v1 — Claude Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#06061a;display:flex;align-items:center;justify-content:center;min-height:100vh}
  a{color:#ffd479;text-decoration:none}a:hover{color:#fff}
  @keyframes sc-pop{0%{opacity:0;transform:translateY(10px) scale(.7)}60%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes sc-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  @keyframes sc-rays{to{transform:rotate(360deg)}}
  @keyframes sc-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sc-breathe{0%,100%{opacity:.55}50%{opacity:.9}}
  #next-btn{transition:transform .1s ease-out}
  #next-btn:active{transform:translateY(4px)}
</style>
</head>
<body>
<div style="width:402px;height:874px;position:relative;overflow:hidden;border-radius:38px;background:radial-gradient(125% 78% at 50% 24%, #302a5e 0%, #201a48 32%, #120f31 62%, #08071c 88%, #050414 100%);font-family:'DM Sans',system-ui,sans-serif;user-select:none">

  <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, rgba(255,199,102,.20), rgba(255,199,102,.05) 42%, transparent 68%);animation:sc-breathe 5s ease-in-out infinite"></div>
  <div style="position:absolute;left:-40%;top:-32%;width:180%;height:120%;opacity:.32;background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,224,160,.5) 0deg 3deg, transparent 3deg 17deg);mask-image:radial-gradient(circle at 50% 50%, rgba(0,0,0,.9) 0%, transparent 62%);-webkit-mask-image:radial-gradient(circle at 50% 50%, rgba(0,0,0,.9) 0%, transparent 62%);animation:sc-rays 120s linear infinite"></div>
  <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px);mix-blend-mode:overlay"></div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:132px;background:linear-gradient(180deg, rgba(8,7,28,0) 0%, rgba(8,7,28,.85) 60%, #07061a 100%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:0;opacity:.9">
    <div style="flex:1;height:26px;background:#100d2c"></div>
    <div style="flex:1;height:14px;background:#100d2c"></div>
    <div style="flex:1;height:34px;background:#0d0a26"></div>
    <div style="flex:1;height:18px;background:#100d2c"></div>
    <div style="flex:1;height:44px;background:#0d0a26"></div>
    <div style="flex:1;height:22px;background:#100d2c"></div>
    <div style="flex:1;height:12px;background:#100d2c"></div>
    <div style="flex:1;height:30px;background:#0d0a26"></div>
  </div>

  <div style="position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:'Press Start 2P',monospace;font-size:8px;color:rgba(255,255,255,.5);letter-spacing:.5px">
    <span>9:41</span>
    <span style="display:flex;gap:3px;align-items:center"><span style="width:4px;height:4px;background:rgba(255,255,255,.5)"></span><span style="width:4px;height:7px;background:rgba(255,255,255,.5)"></span><span style="width:4px;height:10px;background:rgba(255,255,255,.5)"></span><span style="width:14px;height:8px;border:2px solid rgba(255,255,255,.45);margin-left:4px;padding:1px"><span style="display:block;width:100%;height:100%;background:rgba(255,255,255,.6)"></span></span></span>
  </div>

  <div style="position:absolute;inset:0;pointer-events:none">
    <div style="position:absolute;left:44px;top:150px;width:4px;height:4px;background:#fff;box-shadow:4px 0 #fff,-4px 0 #fff,0 4px #fff,0 -4px #fff;animation:sc-twinkle 3.1s ease-in-out infinite"></div>
    <div style="position:absolute;left:318px;top:132px;width:3px;height:3px;background:#ffe6b0;box-shadow:3px 0 #ffe6b0,-3px 0 #ffe6b0,0 3px #ffe6b0,0 -3px #ffe6b0;animation:sc-twinkle 2.4s ease-in-out .6s infinite"></div>
    <div style="position:absolute;left:352px;top:206px;width:3px;height:3px;background:#fff;animation:sc-twinkle 4s ease-in-out .2s infinite"></div>
    <div style="position:absolute;left:70px;top:236px;width:3px;height:3px;background:#ffd479;box-shadow:3px 0 #ffd479,-3px 0 #ffd479,0 3px #ffd479,0 -3px #ffd479;animation:sc-twinkle 2.8s ease-in-out 1.1s infinite"></div>
    <div style="position:absolute;left:24px;top:298px;width:2px;height:2px;background:rgba(255,255,255,.7);animation:sc-twinkle 3.6s ease-in-out .9s infinite"></div>
    <div style="position:absolute;left:286px;top:288px;width:4px;height:4px;background:#fff;box-shadow:4px 0 #fff,-4px 0 #fff,0 4px #fff,0 -4px #fff;animation:sc-twinkle 3.3s ease-in-out 1.6s infinite"></div>
    <div style="position:absolute;left:196px;top:118px;width:2px;height:2px;background:rgba(255,255,255,.55);animation:sc-twinkle 5s ease-in-out .4s infinite"></div>
    <div style="position:absolute;left:132px;top:176px;width:2px;height:2px;background:#ffe6b0;animation:sc-twinkle 2.2s ease-in-out 1.4s infinite"></div>
    <div style="position:absolute;left:246px;top:166px;width:3px;height:3px;background:#fff;box-shadow:3px 0 rgba(255,255,255,.8),-3px 0 rgba(255,255,255,.8);animation:sc-twinkle 3.9s ease-in-out .1s infinite"></div>
    <div style="position:absolute;left:366px;top:98px;width:2px;height:2px;background:rgba(255,255,255,.6);animation:sc-twinkle 4.4s ease-in-out 2s infinite"></div>
    <div style="position:absolute;left:88px;top:96px;width:3px;height:3px;background:rgba(255,214,140,.85);animation:sc-twinkle 3s ease-in-out 1.9s infinite"></div>
    <div style="position:absolute;left:340px;top:346px;width:2px;height:2px;background:rgba(255,255,255,.5);animation:sc-twinkle 4.6s ease-in-out .7s infinite"></div>
    <div style="position:absolute;left:52px;top:398px;width:3px;height:3px;background:rgba(255,255,255,.65);animation:sc-twinkle 3.4s ease-in-out 2.4s infinite"></div>
    <div style="position:absolute;left:214px;top:432px;width:2px;height:2px;background:rgba(255,214,140,.6);animation:sc-twinkle 5.2s ease-in-out 1.2s infinite"></div>
    <div style="position:absolute;left:308px;top:494px;width:2px;height:2px;background:rgba(255,255,255,.4);animation:sc-twinkle 4.2s ease-in-out .3s infinite"></div>
    <div style="position:absolute;left:36px;top:520px;width:2px;height:2px;background:rgba(255,255,255,.35);animation:sc-twinkle 6s ease-in-out 1.7s infinite"></div>
  </div>

  <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:0 34px;box-sizing:border-box">

    <div style="height:212px"></div>

    <div style="font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:3px;color:rgba(255,214,140,.75);animation:sc-rise .5s ease-out both">✦ &nbsp;ONE STEP TAKEN&nbsp; ✦</div>

    <div style="margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:0;font-family:'Press Start 2P',monospace;font-size:28px;line-height:1.42;color:#ffd479;text-shadow:0 4px 0 #a05a1e, 0 0 28px rgba(255,180,60,.55)">
      <span style="animation:sc-pop .34s ease-out .05s both">S</span><span style="animation:sc-pop .34s ease-out .11s both">T</span><span style="animation:sc-pop .34s ease-out .17s both">A</span><span style="animation:sc-pop .34s ease-out .23s both">G</span><span style="animation:sc-pop .34s ease-out .29s both">E</span><span style="width:22px"></span><span style="animation:sc-pop .34s ease-out .41s both">C</span><span style="animation:sc-pop .34s ease-out .47s both">L</span><span style="animation:sc-pop .34s ease-out .53s both">E</span><span style="animation:sc-pop .34s ease-out .59s both">A</span><span style="animation:sc-pop .34s ease-out .65s both">R</span>
    </div>

    <div style="margin-top:30px;display:flex;align-items:center;gap:6px;animation:sc-rise .6s ease-out .8s both">
      <span style="width:44px;height:2px;background:linear-gradient(90deg, transparent, rgba(255,214,140,.55))"></span>
      <span style="width:4px;height:4px;background:#ffd479"></span>
      <span style="width:44px;height:2px;background:linear-gradient(90deg, rgba(255,214,140,.55), transparent)"></span>
    </div>

    <p style="margin:32px 0 0;font-size:19px;line-height:1.5;font-weight:500;color:#f4f1ff;text-align:center;text-wrap:pretty;animation:sc-rise .6s ease-out .95s both">Today, you walked this path.</p>
    <p style="margin:12px 0 0;font-size:15px;line-height:1.62;font-weight:300;color:rgba(226,222,255,.62);text-align:center;text-wrap:pretty;max-width:290px;animation:sc-rise .6s ease-out 1.1s both">You didn't have to be perfect. You just really started.</p>

    <div style="flex:1"></div>

    <button id="next-btn" type="button" style="position:relative;width:214px;height:60px;margin-bottom:20px;border:0;padding:0;background:transparent;cursor:pointer;font-family:'Press Start 2P',monospace;animation:sc-rise .6s ease-out 1.3s both">
      <span style="position:absolute;left:0;top:6px;width:100%;height:100%;background:#7a3f12"></span>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#ffc65a;box-shadow:inset 0 -6px 0 rgba(160,90,30,.45), inset 0 6px 0 rgba(255,255,255,.4);color:#3b1d05;font-size:17px;letter-spacing:2px">NEXT</span>
      <span style="position:absolute;left:-4px;top:-4px;right:-4px;bottom:2px;border:4px solid #2a1a3f;pointer-events:none"></span>
    </button>

    <div id="hint" style="margin-bottom:26px;font-family:'Press Start 2P',monospace;font-size:8px;color:rgba(226,222,255,.34);letter-spacing:1.5px">TAP NEXT TO CONTINUE</div>
  </div>

  <div id="flash" style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s ease-out"></div>
</div>
<script>
  var done = false;
  var flashEl = document.getElementById('flash');
  var hintEl = document.getElementById('hint');
  document.getElementById('next-btn').addEventListener('click', function () {
    done = true;
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '0.75';
    hintEl.textContent = 'SEE YOU TOMORROW';
    hintEl.style.color = 'rgba(255,214,140,.8)';
    setTimeout(function () {
      flashEl.style.transition = 'opacity .35s ease-out';
      flashEl.style.opacity = '0';
    }, 120);
    setTimeout(function () {
      location.reload();
    }, 1300);
  });
</script>
</body>
</html>
